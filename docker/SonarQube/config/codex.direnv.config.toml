# Instale como ~/.codex/direnv.config.toml. Este perfil afeta apenas
# sessoes da CLI iniciadas com `codex --profile direnv`.

# As conexoes globais fixas continuam disponiveis no Codex Desktop.
[mcp_servers.MCP_DOCKER]
enabled = false

[mcp_servers.context7]
enabled = false

[mcp_servers.sonarqube-k6-local]
enabled = false

# O servidor privado do processo Desktop nao e necessario na CLI.
[mcp_servers.node_repl]
enabled = false

[mcp_servers.MCP_DOCKER_env]
command = "C:\\Program Files\\Git\\bin\\bash.exe"
args = ["-lc", "exec docker.exe mcp gateway run --profile \"$PROFILE_TOOLKIT\""]
env_vars = ["PROFILE_TOOLKIT"]
enabled = false

[mcp_servers.context7_env]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "API_KEY_CONTEXT7" }
enabled = false

[mcp_servers.github_env]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PERSONAL_ACCESS_TOKEN"
http_headers = { "X-MCP-Toolsets" = "all", "X-MCP-Insiders" = "true" }
enabled = false

[mcp_servers.sonarqube_env]
command = "docker.exe"
args = ["run", "--init", "--rm", "-i", "-e", "SONARQUBE_TOKEN", "-e", "SONARQUBE_URL", "-e", "SONARQUBE_PROJECT_KEY", "-e", "SONARQUBE_READ_ONLY=true", "sonarsource/sonarqube-mcp"]
env_vars = ["SONARQUBE_TOKEN", "SONARQUBE_URL", "SONARQUBE_PROJECT_KEY"]
enabled = false
