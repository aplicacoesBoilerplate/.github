name: Versionamento coordenado do monorepo

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [master]

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-preview.yml@3e68d5c96b38e4b28fd79a47cc5ee4fbbecc4cb1
    with:
      adapter: changesets
      project_path: .
      target_branch: master
      tag_prefix: v

  monorepo-ci:
    uses: ./.github/workflows/monorepo-ci.yml

  publish:
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: monorepo-ci
    permissions:
      contents: write
      pull-requests: read
      issues: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-publish.yml@3e68d5c96b38e4b28fd79a47cc5ee4fbbecc4cb1
    with:
      adapter: changesets
      project_path: .
      target_branch: master
      tag_prefix: v
      publication_environment: production
    secrets:
      versioning_app_id: ${{ secrets.VERSIONING_APP_ID }}
      versioning_app_private_key: ${{ secrets.VERSIONING_APP_PRIVATE_KEY }}
