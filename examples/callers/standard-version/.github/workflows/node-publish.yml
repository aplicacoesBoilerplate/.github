name: Versão e publicação Node

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [master]

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-preview.yml@c9f5317d8e7184b5372e51a2dd1f2eff268e2123
    with:
      adapter: standard-version
      project_path: .
      target_branch: master
      tag_prefix: v

  node-ci:
    uses: ./.github/workflows/node-ci.yml

  publish:
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: node-ci
    permissions:
      contents: write
      pull-requests: read
      issues: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-publish.yml@c9f5317d8e7184b5372e51a2dd1f2eff268e2123
    with:
      adapter: standard-version
      project_path: .
      target_branch: master
      tag_prefix: v
      publication_environment: production
      changelog_path: CHANGELOG.md
    secrets:
      versioning_app_id: ${{ secrets.VERSIONING_APP_ID }}
      versioning_app_private_key: ${{ secrets.VERSIONING_APP_PRIVATE_KEY }}
