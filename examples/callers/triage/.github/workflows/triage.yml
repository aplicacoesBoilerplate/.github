name: Consumer issue triage (chatgpt-session)

# Copy this .github tree into the private consumer's default branch after review.
# Configure model/effort/prompts in .github/llm and Project/fields/reviewer/checks in .github/triage/config.json.
# Repository secrets: CLI_CODEX_SESSION, CLI_CODEX_SESSION_WRITE_PAT, TRIAGE_METADATA_READ_TOKEN.
# The session and its Secrets-write PAT belong only to this consumer, never to the public central repository.
# TRIAGE_VERIFICATION_IMAGE is a repository variable containing an OCI digest with offline product dependencies.
# Adapt the Go checks/paths to your product. No registry login or live credential provisioning occurs in this template.
# For API opt-in use auth_mode: api-key, no session_secret_name/session secrets, and explicit OPENAI_API_KEY instead.
# Do not enable until the pinned central commit is published. No automatic merge, closure or approval.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing open issue; use the consumer default branch
        required: true
        type: number

permissions:
  contents: read
  actions: read

jobs:
  triage:
    if: github.event.repository.private && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/issue-triage.yml@3f7ec89a9e2457e1e839a22d6db6f9dc1c4784f6
    with:
      config_path: .github/triage/config.json
      issue_number: ${{ inputs.issue_number || 0 }}
      auth_mode: chatgpt-session
      session_secret_name: CLI_CODEX_SESSION
      verification_image: ${{ vars.TRIAGE_VERIFICATION_IMAGE }}
    secrets:
      TRIAGE_READ_TOKEN: ${{ secrets.TRIAGE_METADATA_READ_TOKEN }}
      TRIAGE_PUBLISH_TOKEN: ${{ github.token }}
      CODEX_AUTH_JSON: ${{ secrets.CLI_CODEX_SESSION }}
      CODEX_AUTH_WRITE_PAT: ${{ secrets.CLI_CODEX_SESSION_WRITE_PAT }}

  inspect:
    needs: triage
    if: needs.triage.result == 'success' && needs.triage.outputs.artifact_name != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.triage.outputs.config_source_sha }}
          path: consumer
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.triage.outputs.source_sha }}
          path: consumer-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aplicacoesBoilerplate/.github
          ref: 3f7ec89a9e2457e1e839a22d6db6f9dc1c4784f6
          path: automation
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - run: npm ci --prefix automation/scripts/llm --ignore-scripts --no-fund --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.triage.outputs.artifact_name }}
          path: llm-result
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ format('triage-{0}-{1}-issue{2}', github.run_id, github.run_attempt, needs.triage.outputs.issue) }}
          path: triage-input
      - name: Inspect result read-only; never apply or approve its patch
        env:
          EXPECTED_ISSUE_NUMBER: ${{ needs.triage.outputs.issue }}
          EXPECTED_SOURCE_SHA: ${{ needs.triage.outputs.source_sha }}
          EXPECTED_CONFIG_SOURCE_SHA: ${{ needs.triage.outputs.config_source_sha }}
          EXPECTED_AUTOMATION_SHA: 3f7ec89a9e2457e1e839a22d6db6f9dc1c4784f6
          EXPECTED_FINGERPRINT: ${{ needs.triage.outputs.fingerprint }}
        run: node consumer/.github/triage/inspect-result.mjs
