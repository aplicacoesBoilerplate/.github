name: Consumer LLM analysis (chatgpt-session)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  llm:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: aplicacoesBoilerplate/.github/.github/workflows/llm-execute.yml@4d635f25e1f41f179d1dece8c20d77be21cb62b2
    with:
      invocation_id: analyze-main
      config_path: .github/llm/analyze.json
      source_ref: ${{ github.event.repository.default_branch }}
      context_json: '{"request":"Analisar o código do projeto e devolver recomendações verificáveis."}'
      auth_mode: chatgpt-session
      session_secret_name: CLI_CODEX_SESSION
    secrets:
      CODEX_AUTH_JSON: ${{ secrets.CLI_CODEX_SESSION }}
      CODEX_AUTH_WRITE_PAT: ${{ secrets.CLI_CODEX_SESSION_WRITE_PAT }}

  inspect:
    needs: llm
    if: needs.llm.result == 'success' && needs.llm.outputs.status == 'succeeded'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout consumer at the analyzed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.llm.outputs.source_sha }}
          path: consumer
          persist-credentials: false
      - name: Checkout the same central revision for validation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aplicacoesBoilerplate/.github
          ref: 4d635f25e1f41f179d1dece8c20d77be21cb62b2
          path: automation
          persist-credentials: false
      - name: Set up runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Install only pinned validation dependencies
        run: npm ci --prefix automation/scripts/llm --ignore-scripts --no-fund --no-audit
      - name: Download this invocation result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.llm.outputs.artifact_name }}
          path: llm-result
      - name: Validate result identity and files
        env:
          EXPECTED_INVOCATION_ID: analyze-main
          EXPECTED_SOURCE_SHA: ${{ needs.llm.outputs.source_sha }}
          EXPECTED_AUTOMATION_SHA: ${{ needs.llm.outputs.automation_sha }}
          EXPECTED_CONFIG_PATH: .github/llm/analyze.json
        run: node consumer/.github/llm/inspect-result.mjs
