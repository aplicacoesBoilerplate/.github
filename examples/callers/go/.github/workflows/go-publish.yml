name: Publicação Go após integração

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [master]

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-preview.yml@be8fff51d92c10bb00fa8188184117130621a2bb
    with:
      adapter: go-gitsemver
      project_path: .
      target_branch: master

  go-ci:
    uses: ./.github/workflows/go-ci.yml

  publish:
    if: github.event_name == 'push' && github.ref_name == 'master'
    needs: go-ci
    permissions:
      contents: write
      pull-requests: read
      issues: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-publish.yml@be8fff51d92c10bb00fa8188184117130621a2bb
    with:
      adapter: go-gitsemver
      project_path: .
      target_branch: master
