name: Version docs

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, milestoned, demilestoned, closed]
    branches: [master]

permissions:
  contents: read

jobs:
  version-policy:
    if: github.event.action != 'closed'
    permissions:
      contents: read
      pull-requests: read
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-validate.yml@master
    with:
      project-path: docs
      central-ref: master

  release:
    if: github.event.pull_request.merged == true
    permissions:
      contents: write
      pull-requests: write
      issues: write
    uses: aplicacoesBoilerplate/.github/.github/workflows/version-release-please-called.yml@master
    with:
      project-type: node
      project-path: docs
      publish-artifacts: false
      central-ref: master
