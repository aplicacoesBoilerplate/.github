name: Publicar documentação

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/documentacao.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/documentacao.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  documentation:
    uses: aplicacoesBoilerplate/.github/.github/workflows/documentacao-pages.yml@v0.0.1
    with:
      docs-dir: docs
