name: Validação de entregas e homologação

on:
  workflow_call:
    inputs:
      adapter:
        description: Ferramenta de versionamento configurada no consumidor
        required: true
        type: string
      release_branch:
        description: Branch da sprint no formato release/vMAJOR.MINOR.PATCH
        required: true
        type: string
      target_branch:
        description: Branch principal protegida do consumidor (main ou master)
        required: true
        type: string
      project_path:
        description: Diretório relativo do projeto/package no consumidor
        required: false
        default: .
        type: string
    outputs:
      phase:
        description: Fase validada do PR
        value: ${{ jobs.preview.outputs.phase }}
      summary:
        description: Resumo dos vínculos e gates de homologação
        value: ${{ jobs.preview.outputs.summary }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
    outputs:
      phase: ${{ steps.preview.outputs.phase }}
      summary: ${{ steps.preview.outputs.summary }}
    steps:
      - name: Checkout do repositório consumidor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout da automação na mesma revisão do workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-versioning
          persist-credentials: false
      - name: Validar vínculos e gates do PR (somente leitura)
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          RELEASE_BRANCH: ${{ inputs.release_branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PROJECT_PATH: ${{ inputs.project_path }}
        run: bash .shared-versioning/scripts/versioning/preview.sh
      - name: Gerar guia provisório de homologação (opcional)
        if: steps.preview.outputs.phase == 'release-to-develop'
        continue-on-error: true
        env:
          PR_PHASE: ${{ steps.preview.outputs.phase }}
        run: bash .shared-versioning/scripts/versioning/homologation-guide.sh
