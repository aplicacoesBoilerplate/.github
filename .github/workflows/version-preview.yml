name: Version preview and homologation

# Required caller events:
# pull_request types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned]
# pull_request_review types: [submitted, dismissed]
on:
  workflow_call:
    inputs:
      adapter:
        description: Native version adapter selected by the consumer
        required: true
        type: string
      target_branch:
        description: Protected publication branch
        required: true
        type: string
      project_path:
        description: Project directory relative to the consumer checkout
        required: false
        default: .
        type: string
      tag_prefix:
        description: Prefixo literal da tag (v por padrão; alinhar à ferramenta nativa)
        required: false
        default: v
        type: string
    outputs:
      phase:
        description: Evaluated pull request phase
        value: ${{ jobs.preview.outputs.phase }}
      version:
        description: Normalized candidate version
        value: ${{ jobs.preview.outputs.version }}
      bump:
        description: Native adapter increment
        value: ${{ jobs.preview.outputs.bump }}
      policy_outcome:
        description: Current milestone and override decision
        value: ${{ jobs.preview.outputs.policy_outcome }}
      summary:
        description: Human-readable preview result
        value: ${{ jobs.preview.outputs.summary }}
      releases_json:
        description: Changesets package release plan as a JSON array
        value: ${{ jobs.preview.outputs.releases_json }}

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    outputs:
      phase: ${{ steps.preview.outputs.phase }}
      version: ${{ steps.preview.outputs.version }}
      bump: ${{ steps.preview.outputs.bump }}
      policy_outcome: ${{ steps.preview.outputs.policy_outcome }}
      summary: ${{ steps.preview.outputs.summary }}
      releases_json: ${{ steps.preview.outputs.releases_json }}
    steps:
      - name: Checkout consumer repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: consumer
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout centralized automation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-versioning
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Resolve functional evidence for technical PR
        id: origin
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CENTRAL_SHA: ${{ job.workflow_sha }}
          CENTRAL_REPOSITORY: ${{ job.workflow_repository }}
        run: node .shared-versioning/scripts/versioning/dist/entrypoints/resolve-origin.js

      - name: Download validated functional evidence
        if: steps.origin.outputs.technical == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.origin.outputs.artifact_id }}
          run-id: ${{ steps.origin.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/versioning-origin

      - name: Install consumer Node dependencies without lifecycle scripts
        if: (inputs.adapter == 'standard-version' || inputs.adapter == 'changesets') && steps.origin.outputs.technical != 'true'
        working-directory: consumer
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          VERSIONING_WORKSPACE: ${{ github.workspace }}/consumer
        run: >-
          node --input-type=module -e "const { installNpmDependencies } = await import('../.shared-versioning/scripts/versioning/dist/adapters/npm-project.js');
          installNpmDependencies({ workspace: process.env.VERSIONING_WORKSPACE, projectPath: process.env.PROJECT_PATH });"

      - name: Install central Release Please SDK
        if: inputs.adapter == 'release-please' && steps.origin.outputs.technical != 'true'
        working-directory: .shared-versioning/scripts/versioning/tools/release-please
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Set up Java for jgitver
        if: inputs.adapter == 'jgitver'
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Maven
        if: inputs.adapter == 'jgitver'
        run: >-
          node --input-type=module -e "const { installPinnedMaven } = await import('./.shared-versioning/scripts/versioning/dist/adapters/maven-installer.js');
          installPinnedMaven({ runnerTemp: process.env.RUNNER_TEMP, githubPath: process.env.GITHUB_PATH });"

      - name: Set up Go for go-gitsemver
        if: inputs.adapter == 'go-gitsemver'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install pinned go-gitsemver
        if: inputs.adapter == 'go-gitsemver'
        run: go install github.com/MyCarrier-DevOps/go-gitsemver@680c1c12d9a4f573a8da1b2e3ccebb3571b1cab6

      - name: Calculate and validate preview
        id: preview
        working-directory: consumer
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          PROJECT_PATH: ${{ inputs.project_path }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
          VERSIONING_OUTPUT_DIR: ${{ runner.temp }}/versioning
          VERSIONING_WORKSPACE: ${{ github.workspace }}/consumer
          VERSIONING_ORIGIN_DIR: ${{ steps.origin.outputs.technical == 'true' && format('{0}/versioning-origin', runner.temp) || '' }}
          CENTRAL_SHA: ${{ job.workflow_sha }}
          CENTRAL_REPOSITORY: ${{ job.workflow_repository }}
        run: node ../.shared-versioning/scripts/versioning/dist/entrypoints/preview.js

      - name: Upload homologation guide
        if: steps.preview.outputs.phase == 'release-to-develop'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: homologation-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/versioning/homologation.md
            ${{ runner.temp }}/versioning/homologation.json
          if-no-files-found: error
