name: "Correção direta e revisão"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      base_branch:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      context:
        required: true
        type: string
      model:
        required: true
        type: string
      source_sha:
        required: true
        type: string
    outputs:
      created_pr_number:
        description: Number of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_number }}
      created_pr_url:
        description: URL of the first created pull request
        value: ${{ jobs.safe_outputs.outputs.created_pr_url }}
      push_commit_sha:
        description: SHA of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_sha }}
      push_commit_url:
        description: URL of the pushed commit
        value: ${{ jobs.safe_outputs.outputs.push_commit_url }}
    secrets:
      CODEX_API_KEY:
        required: false
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_CI_TRIGGER_TOKEN:
        required: false
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      OPENAI_API_KEY:
        required: true

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: "gh-aw-agentic-direct-${{ github.run_id }}"
  queue: max

run-name: "Correção direta e revisão"

env:
