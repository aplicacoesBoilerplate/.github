name: Publicação de versionamento por sprint

on:
  workflow_call:
    inputs:
      adapter:
        required: true
        type: string
      project_path:
        required: false
        default: .
        type: string
      target_branch:
        required: true
        type: string
      publication_environment:
        description: Environment protegido opcional no repositório consumidor
        required: false
        default: ''
        type: string
      changelog_path:
        required: false
        default: ''
        type: string
    outputs:
      version:
        value: ${{ jobs.publish.outputs.version }}
      tag:
        value: ${{ jobs.publish.outputs.tag }}
      published_sha:
        value: ${{ jobs.publish.outputs.published_sha }}
      release_url:
        value: ${{ jobs.publish.outputs.release_url }}
      outcome:
        value: ${{ jobs.publish.outputs.outcome }}

jobs:
  environment-gate:
    if: inputs.publication_environment != ''
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publication_environment }}
    permissions:
      contents: read
    steps:
      - name: Confirmar liberação do environment
        run: echo "Environment autorizado para publicação"

  publish:
    needs: environment-gate
    if: >-
      ${{ always() && github.event_name == 'push' && github.ref_name == inputs.target_branch &&
      (needs.environment-gate.result == 'success' || needs.environment-gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    concurrency:
      group: version-publish-${{ github.repository }}-${{ inputs.target_branch }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
      issues: read
    outputs:
      version: ${{ steps.publish.outputs.version }}
      tag: ${{ steps.publish.outputs.tag }}
      published_sha: ${{ steps.publish.outputs.published_sha }}
      release_url: ${{ steps.publish.outputs.release_url }}
      outcome: ${{ steps.publish.outputs.outcome }}
    steps:
      - name: Checkout do commit integrado no consumidor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout da automação na mesma revisão do workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .shared-versioning
          persist-credentials: false
      - name: Preparar Go para go-gitsemver
        if: inputs.adapter == 'go-gitsemver'
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.0'
      - name: Instalar go-gitsemver em revisão fixa
        if: inputs.adapter == 'go-gitsemver'
        run: |
          go install github.com/MyCarrier-DevOps/go-gitsemver@680c1c12d9a4f573a8da1b2e3ccebb3571b1cab6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Conferir gates e publicar tag/release sem sobrescrever
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ADAPTER: ${{ inputs.adapter }}
          PROJECT_PATH: ${{ inputs.project_path }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          CHANGELOG_PATH: ${{ inputs.changelog_path }}
        run: bash .shared-versioning/scripts/versioning/publish.sh
