name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        if: ${{ hashFiles('pom.xml') != '' }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Maven project
        if: ${{ hashFiles('pom.xml') != '' }}
        run: mvn -B verify

      - name: Set up Node.js
        if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        if: ${{ hashFiles('package-lock.json', 'npm-shrinkwrap.json') != '' }}
        run: npm ci

      - name: Run npm tests when available
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: npm run test --if-present

      - name: Run npm build when available
        if: ${{ hashFiles('package.json') != '' }}
        shell: bash
        run: npm run build --if-present

  versioning:
    name: Validate centralized versioning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Set up Python for semantic workflow contracts
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned YAML parser
        run: python -m pip install PyYAML==6.0.1
      - name: Install central TypeScript toolchain
        working-directory: scripts/versioning
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck central versioning without emitting
        run: npm --prefix scripts/versioning run typecheck
      - name: Verify received compiled distribution before build
        run: npm --prefix scripts/versioning run check-dist
      - name: Run deterministic versioning fixtures
        # Semantic YAML contracts are part of the deterministic suite.
        run: node tests/versioning/run.mjs --local
      - name: Run real standard-version fixture
        run: node tests/versioning/real-standard-version.mjs
      - name: Run real standard-version bootstrap and rejection fixtures
        run: node tests/versioning/real-standard-bootstrap.mjs
      - name: Run real Changesets fixture
        run: node tests/versioning/real-changesets.mjs
      - name: Run real Release Please SDK fixture
        run: node tests/versioning/real-release-please.mjs
      - name: Set up Java for real jgitver fixture
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Maven
        run: >-
          node --input-type=module -e "import { installPinnedMaven } from
          './scripts/versioning/dist/adapters/maven-installer.js';
          await installPinnedMaven({ runnerTemp: process.env.RUNNER_TEMP,
          githubPath: process.env.GITHUB_PATH });"
      - name: Validate Maven installer and checksum rejection
        run: node tests/versioning/maven-setup.mjs
      - name: Run real jgitver fixture
        run: node tests/versioning/real-jgitver.mjs
      - name: Run real multi-module Maven reactor and native prefix fixtures
        run: |
          node tests/versioning/real-maven-reactor.mjs
          node tests/versioning/real-jgitver-prefix.mjs
      - name: Validate real distributable Maven POMs and JARs without deploy
        run: node tests/versioning/real-maven-artifacts.mjs
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.0'
      - name: Install pinned go-gitsemver
        run: |
          go install github.com/MyCarrier-DevOps/go-gitsemver@680c1c12d9a4f573a8da1b2e3ccebb3571b1cab6
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run real Go adapter fixture
        run: node tests/versioning/run.mjs --real-go
