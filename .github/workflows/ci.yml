name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - "release/**"

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/ci-scripts/package-lock.json

      - name: Install CI Scripts dependencies
        working-directory: .github/ci-scripts
        run: npm ci

      - name: Run Release Please Orchestrator & Pipeline Tests
        working-directory: .github/ci-scripts
        run: npm test