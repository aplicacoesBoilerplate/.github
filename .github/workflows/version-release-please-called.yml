name: Release Please Called

on:
  workflow_call:
    inputs:
      project-type:
        description: 'Tipo do projeto (node, go, maven, gradle, simple)'
        required: true
        type: string
      central-ref:
        description: 'Revisão dos scripts centrais; use o mesmo SHA revisado da referência ao called'
        required: false
        type: string
        default: master
      publish-artifacts:
        description: 'Publicar pacotes ou binários após a Release (etapa 2)'
        required: false
        type: boolean
        default: false

jobs:
  release-please:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # 1. Faz o checkout do repositório da aplicação (Caller)
      - name: Checkout Aplicação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      # 2. Faz o checkout dos scripts centralizados do seu repo .github em uma pasta isolada
      - name: Checkout Scripts Centralizados
        uses: actions/checkout@v4
        with:
          repository: aplicacoesBoilerplate/.github
          path: .ci-scripts
          ref: ${{ inputs.central-ref }}

      # 3. Configura o Node para executar o script TypeScript
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar runtime central travado
        run: npm ci --prefix .ci-scripts/ci-scripts --omit=dev --ignore-scripts

      # 4. Executa o orquestrador e fornece os parâmetros efetivos da Action
      - name: Executar Orquestrador TS
        id: orchestrator
        run: node .ci-scripts/ci-scripts/node_modules/tsx/dist/cli.mjs .ci-scripts/ci-scripts/scripts/release-orchestrator.ts
        env:
          PROJECT_TYPE: ${{ inputs.project-type }}
          MILESTONE_TITLE: ${{ github.event.pull_request.milestone.title }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}

      # 5. Remove os scripts auxiliares antes do Release Please rodar para não sujar a árvore do Git
      - name: Limpar Scripts Temporários
        run: rm -rf .ci-scripts

      # 6. Executa o Release Please (Cria o PR de Release OU gera a Tag + GitHub Release)
      - name: Executar Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: ${{ steps.orchestrator.outputs.release_type }}
          release-as: ${{ steps.orchestrator.outputs.release_as }}

      # ==================================================================================
      # 7. ADAPTADORES PÓS-TAG (Executam apenas quando o PR do Release Please é mergeado)
      # ==================================================================================
      - name: Adaptador GoReleaser (Go)
        if: ${{ steps.release.outputs.release_created == 'true' && inputs.project-type == 'go' && inputs.publish-artifacts }}
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Adaptador NPM (Node / Vue / TS)
        if: ${{ steps.release.outputs.release_created == 'true' && inputs.project-type == 'node' && inputs.publish-artifacts }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Adaptador Maven (Java / Kotlin)
        if: ${{ steps.release.outputs.release_created == 'true' && inputs.project-type == 'maven' && inputs.publish-artifacts }}
        run: mvn deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
